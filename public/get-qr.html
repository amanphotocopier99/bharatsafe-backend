<script>
document.addEventListener('DOMContentLoaded', function () {
  const form = document.getElementById('qrDetailsForm');
  const successMsg = document.getElementById('successMessage');
  const submitBtn = document.getElementById('submitBtn');
  const hiddenProductType = document.getElementById('hiddenProductType');
  const tagSelect = document.getElementById('tagType');

  // Safety check — if any element is missing, stop silently
  if (!form || !submitBtn || !tagSelect) return;

  // Pre-select tag type from URL (?type=bike)
  const urlParams = new URLSearchParams(window.location.search);
  const preselectedType = urlParams.get('type');
  if (preselectedType && ['bike', 'car', 'luggage'].includes(preselectedType)) {
    tagSelect.value = preselectedType;
    if (hiddenProductType) hiddenProductType.value = preselectedType;
  }

  // Update hidden field when dropdown changes
  tagSelect.addEventListener('change', (e) => {
    if (hiddenProductType) hiddenProductType.value = e.target.value;
  });

  // Handle form submission
  form.addEventListener('submit', async function (e) {
    e.preventDefault();

    const payload = {
      fullName:  form.fullName.value.trim(),
      phone:     form.contactNumber.value.trim(),
      email:     form.email.value.trim(),
      address:   form.address.value.trim(),
      bloodGroup: form.bloodGroup.value,
      tagType:   form.tagType.value,
      emergencyContact: '',
      note: ''
    };

    if (!payload.fullName || !payload.phone || !payload.email ||
        !payload.address || !payload.bloodGroup || !payload.tagType) {
      alert('Please fill in all the fields.');
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Saving…';

    try {
      const res = await fetch('/api/leads', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      if (!res.ok) throw new Error('Server error');
      const data = await res.json();
      console.log('Saved lead ID:', data.id);

      if (successMsg) successMsg.style.display = 'block';
      submitBtn.textContent = '✓ Details saved';
      submitBtn.style.background = '#2e7d32';
      submitBtn.style.borderColor = '#2e7d32';
      form.reset();
    } catch (err) {
      console.error(err);
      alert('Could not save. Please try again.');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Create my BharatSafe ID ↗';
    }
  });
});
</script>
